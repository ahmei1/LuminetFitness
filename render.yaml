services:
  - type: web
    name: luminet-fitness-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://luminet-fitness.vercel.app
      - key: DATABASE_URL
        sync: false
